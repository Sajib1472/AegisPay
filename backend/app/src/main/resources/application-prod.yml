spring:
  config:
    activate:
      on-profile: prod

aegispay:
  seed: false
  cors:
    origin: ${FRONTEND_ORIGIN}
  jwt:
    secret: ${JWT_SECRET}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
