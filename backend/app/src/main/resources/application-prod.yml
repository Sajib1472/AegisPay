spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs

aegispay:
  seed: false
  redis:
    required: true
