spring:
  application:
    name: aegispay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aegispay}
    username: ${POSTGRES_USER:aegispay}
    password: ${POSTGRES_PASSWORD:aegispay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  profiles:
    default: local
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    generator:
      write-bigdecimal-as-plain: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: AegisPay
    engine: 0.2.0

aegispay:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-64-character-secret-before-any-real-tenant-xx}
    issuer: ${JWT_ISSUER:https://aegispay.local}
    access-minutes: 15
    refresh-days: 7
  cors:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  seed: ${AEGISPAY_SEED:false}
  redis:
    required: ${AEGISPAY_REDIS:false}
    url: ${REDIS_URL:redis://localhost:6379}
  mfa:
    payroll-approve: ${AEGISPAY_MFA_PAYROLL_APPROVE:false}
  build:
    commit: ${GIT_COMMIT:dev}
  storage:
    local-dir: ${AEGISPAY_OBJECT_DIR:${user.home}/.aegispay/objects}
